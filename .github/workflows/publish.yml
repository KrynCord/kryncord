name: publish

# Publica quando aparece uma tag `v*`. O caminho é:
#
#   push tag v0.1.0b1
#        │
#        ▼
#   checks (pytest + ruff + mypy) ── falhou para tudo
#        │
#        ▼
#   build (sdist + wheel + twine check)
#        │
#        ▼
#   publish-testpypi ── TestPyPI, para conferir o pacote de verdade
#        │
#        ▼
#   publish-pypi ────── PyPI, daí vira `pip install kryncord`
#
# Autenticação por Trusted Publishing (OIDC): nenhum token de API
# guardado no GitHub. Cada ambiente (`testpypi`, `pypi`) é configurado
# uma vez no site do PyPI apontando para este arquivo.
#
# A 0.1.0b1 foi publicada na mão com twine antes de o Trusted Publishing
# existir, então a gatilho por tag está DESLIGADO por enquanto — dá para
# disparar na mão pela aba Actions. Para religar:
#
#   1. configurar o Trusted Publisher no PyPI e no TestPyPI
#      (owner `KrynCord`, repo `kryncord`, workflow `publish.yml`,
#      environments `pypi` e `testpypi`);
#   2. trocar abaixo `workflow_dispatch` por:
#
#      on:
#        push:
#          tags: ["v*"]

on:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests && ruff format --check src tests

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Uma tag `v1.2.3` publicando um `1.2.4` é o erro clássico: o
      # PyPI não deixa sobrescrever, e a tag fica mentindo pra sempre.
      - name: Confere se a tag bate com a versão
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag '$TAG' != versão do pyproject.toml '$VERSION'"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
