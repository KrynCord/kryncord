[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kryncord"
version = "0.1.0b1"
description = "Async-first Discord API library for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["discord", "api", "async", "bot", "gateway", "rest"]
authors = [
    { name = "kruldevb" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1,<1",
    "websockets>=17.2,<18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.13",
]

[project.urls]
Homepage = "https://github.com/KrynCord/kryncord"
Repository = "https://github.com/KrynCord/kryncord"
Documentation = "https://github.com/KrynCord/kryncord#readme"
Issues = "https://github.com/KrynCord/kryncord/issues"
Changelog = "https://github.com/KrynCord/kryncord/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/kryncord"]

# O sdist é o que o PyPI serve como "código fonte" — e sem esta lista o
# hatchling mete tudo que estiver na pasta, incluindo `base/` (14 MB de
# discord.js de referência) e os rascunhos de `ideias/`. Aqui entra só
# o que um estranho precisa para rebuildar a partir do source.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "examples",
    "docs",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# `tests/conftest.py` é importado como `tests.conftest`, o que exige a
# raiz do projeto no `sys.path`. `python -m pytest` coloca o CWD lá
# sozinho; o binário `pytest` (que é o que a CI roda) não — e aí a
# coleção inteira falha com ModuleNotFoundError.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # o formatter cuida da largura; não vamos lutar com strings longas
    "RUF001", # nomes de entidades do Discord são ambíguos por natureza
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
# `src` não resolve `tests.conftest` (procura `tests/tests/conftest.py`),
# então declaramos na mão — senão `tests` vira terceiro-party e o import
# pula para cima do bloco do kryncord.
known-first-party = ["kryncord", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
mypy_path = "src"
packages = ["kryncord"]
